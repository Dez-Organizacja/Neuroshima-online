# =============================================================================
# nginx reverse proxy dla backendu gry
# -----------------------------------------------------------------------------
# Zalozenia:
#   - backend (Spring Boot) slucha na 127.0.0.1:8080 (patrz docker-compose.yml)
#   - engine (Python) NIE jest wystawiany - tylko siec wewnetrzna docker
#   - TLS terminowany tutaj (Let's Encrypt). Wygeneruj cert:
#       sudo certbot --nginx -d heuroshimanex.pl
#     (certbot sam dopisze sciezki ssl_certificate ponizej)
#
# Instalacja (host):
#   sudo cp deploy/nginx/neuroshima-backend.conf /etc/nginx/conf.d/
#   # ustaw server_name na swoja domene, potem:
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Limit prob logowania/rejestracji (ochrona przed brute-force/spamem).
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Format logu BEZ query stringa - token WS bywa przekazywany jako ?token=...
log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent"';

# Przekierowanie HTTP -> HTTPS (+ sciezka dla odnawiania certyfikatu ACME)
server {
    listen 80;
    listen [::]:80;
    server_name heuroshimanex.pl;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name heuroshimanex.pl;

    # --- TLS (sciezki dopisze/zmieni certbot) ---
    # ssl_certificate     /etc/letsencrypt/live/heuroshimanex.pl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/heuroshimanex.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/backend-access.log no_query;

    # Naglowki bezpieczenstwa
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket gry
    location /ws/chat {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Rate limit na logowanie i rejestracje
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reszta ruchu (REST + strony statyczne)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
