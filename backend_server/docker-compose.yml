services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    # Engine NIE jest wystawiany publicznie - nie ma własnej autoryzacji.
    # Dostępny tylko wewnątrz sieci docker jako http://engine:5000 (woła go webapp).
    expose:
      - "5000"
    volumes:
      - ./log:/app/src/log

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    # Słucha tylko na loopback hosta - z internetu dostęp wyłącznie przez nginx (reverse proxy).
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./log:/app/logs
      - ./webapp/db:/app/db
    command: ["--game.state-service.url=http://engine:5000/api/neuroshima"]
    depends_on:
      - engine
