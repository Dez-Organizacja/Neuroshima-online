# Profil produkcyjny - aktywuj przez SPRING_PROFILES_ACTIVE=prod
# lub --spring.profiles.active=prod
#
# Captcha jest self-hosted (obrazkowa) - nie wymaga zadnych kluczy ani sekretow.

# Originy frontu na produkcji (bez localhost). Ustaw swoja domene:
app.cors.allowed-origins=https://heuroshimanex.pl

# Zablokuj otwarta rejestracje (konta zakladane administracyjnie).
# Jesli rejestracja przez strone z captcha ma byc publiczna - ustaw true.
auth.registration.enabled=false

# Czy captcha jest WYMAGANA przy rejestracji. Domyslnie false (wstecznie kompatybilne) -
# ustaw na true, gdy klient (np. aplikacja Python) dorobi obsluge captchy.
captcha.required=false

# URL engine w sieci wewnetrznej docker (nie wystawiaj engine publicznie).
game.state-service.url=http://engine:5000/api/neuroshima

# Aplikacja stoi za nginx (TLS terminowany w proxy); slucha tylko lokalnie.
server.address=127.0.0.1
server.forward-headers-strategy=framework
