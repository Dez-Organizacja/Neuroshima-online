<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Neuroshima</title>
  <style>
    :root { --bg:#0f1115; --fg:#e6e8ec; --muted:#9aa3b2; --accent:#4f8cff; }
    * { box-sizing: border-box; }
    html, body { height:100%; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: radial-gradient(1100px 560px at 50% -8%, #161b24 0%, var(--bg) 62%);
           color: var(--fg); display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
    .welcome { text-align:center; max-width:480px; }

    /* --- Obracający się heksagon z subtelnym cieniowaniem --- */
    .hex-stage { display:flex; justify-content:center; margin-bottom:36px; }
    .hex {
      position:relative; width:144px; height:144px;
      animation: hex-spin 16s linear infinite;
      /* miękka poświata podążająca za kształtem (drop-shadow respektuje clip-path) */
      filter: drop-shadow(0 12px 28px rgba(79,140,255,.30));
    }
    .hex::before, .hex::after {
      content:""; position:absolute;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }
    /* warstwa bazowa — gradient daje wrażenie światła padającego z góry-lewej (cieniowanie) */
    .hex::before {
      inset:0;
      background: linear-gradient(145deg, #5b9bff 0%, #3a6bd0 46%, #1d2f63 100%);
    }
    /* warstwa połysku — delikatny highlight na górnej krawędzi, subtelny lecz efektowny */
    .hex::after {
      inset:11px;
      background: linear-gradient(150deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.05) 28%, transparent 54%);
    }
    @keyframes hex-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .hex { animation: none; } }

    h1 { margin:0; font-size:2.2rem; letter-spacing:.16em; font-weight:700; }
  </style>
</head>
<body>
  <main class="welcome">
    <div class="hex-stage"><div class="hex" aria-hidden="true"></div></div>
    <h1>NEUROSHIMA</h1>
  </main>
</body>
</html>
