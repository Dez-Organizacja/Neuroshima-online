# URL serwisu stanu gry u?ywanego przy tworzeniu nowej gry
# game.state-service.url=http://127.0.0.1:5000/api/neuroshima

# Plik z u?ytkownikami (format: username:{id}hash lub username:haslo)
auth.users.file=users.txt

# Czas ?ycia tokenu logowania dla WebSocket (sekundy)
auth.token.ttl-seconds=3600

# Typ repozytorium u?ytkownik?w: 'db' (domy?lnie) lub 'file'
app.user-repository=db

# Konfiguracja bazy danych SQLite
spring.datasource.url=jdbc:sqlite:db/users.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Konfiguracja JPA/Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Bezpieczenstwo / wystawienie publiczne ---

# Dozwolone originy (CORS + WebSocket). Lista po przecinku.
# Na produkcji ustaw na adres frontu, np. https://twoja-domena
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080

# Czy rejestracja przez API jest dostepna. Domyslnie true (odblokowana).
# Na produkcji ustaw false, aby zablokowac rejestracje.
auth.registration.enabled=true

# CAPTCHA obrazkowa przy rejestracji (self-hosted, dziala dla dowolnego klienta - tez Python).
# Brak jakichkolwiek kluczy/sekretow.
# captcha.required=false (domyslnie) -> rejestracja NIE wymaga captchy (wstecznie kompatybilne,
#   tak jak dotychczas lokalnie). Endpoint GET /api/auth/captcha dziala mimo to, wiec klient
#   moze juz dorabiac obsluge. Ustaw true, aby wymagac poprawnej captchy do rejestracji.
captcha.required=false
# Liczba znakow w kodzie captcha.
captcha.length=5
# Czas zycia wyzwania captcha w sekundach (5 minut).
captcha.ttl-seconds=300

# Nie ujawniaj szczegolow bledow w odpowiedziach HTTP
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
